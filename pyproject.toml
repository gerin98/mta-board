[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mta-board"
version = "0.1.0"
description = "Virtual and HUB75 LED arrival board for the NYC subway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gtfs-realtime-bindings>=1.0.0",
  "Pillow>=9.4",
]

[project.scripts]
mta-board = "mta_board.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mta_board = ["data/*.json"]
